<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casper Loto — GitHub social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body { background: #0A1328; color: #F6EDD7; font-family: Arial, sans-serif; }
    main { position: relative; width: 100%; height: 100%; padding: 52px 84px; }
    main::before { content: ""; position: absolute; inset: 24px; border: 1px solid #D4A96255; border-radius: 20px; }
    .logo { display: block; width: 510px; height: 170px; object-fit: contain; object-position: left; }
    .rule { width: 64px; height: 3px; background: #D4A962; margin: 24px 0 26px; }
    h1 { margin: 0; font-size: 62px; line-height: 1.12; font-weight: 600; letter-spacing: -1.5px; }
    .intro { margin: 24px 0 0; font-size: 30px; line-height: 1.4; }
    .principle { margin: 12px 0 0; font-size: 23px; color: #F6EDD7BB; }
    footer { position: absolute; bottom: 62px; left: 84px; right: 84px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; }
    .invitation { color: #D4A962; font-weight: bold; }
    .languages { color: #F6EDD7BB; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../frontend/shared/assets/brand/logo-horizontal.png" alt="Casper Loto">
    <div class="rule"></div>
    <h1>Удача ничего не стоит</h1>
    <p class="intro">Бесплатные лотереи в Telegram</p>
    <p class="principle">Без доната · Без денежных ставок · Только игровые CAS</p>
    <footer><span class="invitation">Просто попробуй →</span><span class="languages">Русский / English</span></footer>
  </main>
</body>
</html>
