<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050d27" />
    <link rel="icon" href="/brand/favicon-64-v1.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/brand/app-icon-180-v1.png" sizes="180x180" />
    <link rel="preload" as="image" href="/brand/logo-symbol-128-v1.png" media="(max-width: 520px)" />
    <link rel="preload" as="image" href="/brand/logo-horizontal-432-v1.png" media="(min-width: 521px)" />
    <style>
      html,body{margin:0;min-height:100%;background:#050d27;color:#f5f7ff}
      #root>.boot-shell{box-sizing:border-box;max-width:540px;min-height:100vh;margin:auto;padding:16px 18px}
      .boot-shell *{box-sizing:border-box}
      .boot-head{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:8px}
      .boot-brand,.boot-brand picture,.boot-brand img{display:block;width:138px;height:42px}
      .boot-brand img{object-fit:contain;object-position:left center}
      .boot-placeholder{border-radius:14px;background:#0e1c40}
      .boot-balance{width:108px;height:38px}
      .boot-title{width:75%;height:82px;margin-top:30px}
      .boot-draw{height:112px;margin-top:14px}
      .boot-card{height:345px;margin-top:14px;border-radius:25px}
      @media(max-width:520px){.boot-brand,.boot-brand picture,.boot-brand img{width:42px}}
      @media(max-width:359px){#root>.boot-shell{padding-inline:14px}}
    </style>
    <title>Casper Loto</title>
  </head>
  <body>
    <div id="root"><main class="boot-shell" aria-label="Casper Loto"><header class="boot-head"><div class="boot-brand" aria-label="Casper Loto"><picture><source media="(max-width: 520px)" srcset="/brand/logo-symbol-128-v1.png" /><img src="/brand/logo-horizontal-432-v1.png" width="138" height="42" alt="" fetchpriority="high" /></picture></div><div class="boot-placeholder boot-balance"></div></header><div class="boot-placeholder boot-title"></div><div class="boot-placeholder boot-draw"></div><div class="boot-placeholder boot-card"></div></main></div>
    <script>performance.mark("miniapp:shell-ready")</script>
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
