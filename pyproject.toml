[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "k-loto"
version = "1.55.2"
description = "Casper Loto virtual lottery platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "aiogram>=3.18,<4",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "Pillow>=12,<13",
    "pwdlib[argon2]>=0.3,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=24.4,<26",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "paramiko>=3.5,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
k-loto-bot = "k_loto.infrastructure.telegram_bot:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"k_loto.application" = ["publication_templates.json", "publication_event_config.json", "publication_copy.json", "publication_lottery_config.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = [".", "backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend/src", "backend/tests"]
exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["k_loto"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
