services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOTTERY_BOT_TOKEN: ${LOTTERY_BOT_TOKEN:?Set LOTTERY_BOT_TOKEN in .env}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-28800}
      ADMIN_REMEMBER_MAX_AGE_SECONDS: ${ADMIN_REMEMBER_MAX_AGE_SECONDS:-7776000}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn k_loto.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOTTERY_BOT_TOKEN: ${LOTTERY_BOT_TOKEN:?Set LOTTERY_BOT_TOKEN in .env}
      BOT_OUTBOX_INTERVAL_SECONDS: ${BOT_OUTBOX_INTERVAL_SECONDS:-2}
      BOT_MAX_TICKETS_PER_PURCHASE: ${BOT_MAX_TICKETS_PER_PURCHASE:-20}
      MINIAPP_URL: ${MINIAPP_URL:-}
      SCHEDULER_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "bot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
